services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: real-estate-api

    ports:
      - "8000:8000"

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "/app"
      DATABASE_URL: "${DATABASE_URL}"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
